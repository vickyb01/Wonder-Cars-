services:
  - type: web
    name: wonder-cars-backend
    env: node
    plan: free
    region: oregon
    buildCommand: if [ -d "backend" ]; then cd backend && npm install; else npm install; fi
    startCommand: if [ -d "backend" ]; then cd backend && npm start; else npm start; fi
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
